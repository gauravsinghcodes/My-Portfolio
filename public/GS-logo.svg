<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="gs-logo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Border highlight -->
    <linearGradient id="gs-logo-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1" />
    </linearGradient>

    <!-- Pink Star Gradient -->
    <linearGradient id="gs-star-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF69B4" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
  </defs>

  <!-- Background Squircle -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#gs-logo-bg)" />
  <rect x="6.5" y="6.5" width="107" height="107" rx="27.5" fill="none" stroke="url(#gs-logo-border)" stroke-width="1.5" />

  <!-- Left Bracket '<' -->
  <path d="M 23 60 L 31 52 M 23 60 L 31 68" 
        stroke="#FFFFFF" 
        stroke-opacity="0.45" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" />

  <!-- Right Bracket '>' -->
  <path d="M 97 60 L 89 52 M 97 60 L 89 68" 
        stroke="#FFFFFF" 
        stroke-opacity="0.45" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" />

  <!-- Vector 'G' -->
  <path d="M 56 46.5 C 53.5 42, 49.5 40, 44.5 40 C 37.5 40, 33 46, 33 57 C 33 68, 37.5 74, 44.5 74 C 51.5 74, 56 69.5, 56 62.5 V 57 H 46 V 62.5 C 46 66, 45.5 67.5, 44.5 67.5 C 39.5 67.5, 39 63.5, 39 57 C 39 50.5, 39.5 46.5, 44.5 46.5 C 48.5 46.5, 51.5 48, 53 50 L 56 46.5 Z" 
        fill="#FFFFFF" />

  <!-- Vector 'S' -->
  <path d="M 85 46.5 C 82.5 42, 78.5 40, 73.5 40 C 66.5 40, 64 45.5, 64 51 C 64 56.5, 68 58.5, 73.5 60 C 79 61.5, 84 63.5, 84 68 C 84 73.5, 79.5 74, 73.5 74 C 67.5 74, 64.5 70, 64 65.5 L 68.5 64.5 C 69 67, 70.5 68, 73.5 68 C 77 68, 78 66.5, 78 64.5 C 78 62.5, 75 61, 70.5 59.5 C 65.5 58, 69.5 51, 69.5 50 C 69.5 47.5, 71.5 46, 73.5 46 C 76.5 46, 79.5 47.5, 81 49.5 L 85 46.5 Z" 
        fill="#FFFFFF" />

  <!-- 4-pointed Sparkle Star on top right of S -->
  <path d="M 83 38 Q 83 43 88 43 Q 83 43 83 48 Q 83 43 78 43 Q 83 43 83 38 Z" 
        fill="url(#gs-star-grad)" />
  <circle cx="83" cy="43" r="1.2" fill="#FFFFFF" opacity="0.9" />
</svg>
