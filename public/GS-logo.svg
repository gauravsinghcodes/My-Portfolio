<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="gs-logo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Border highlight -->
    <linearGradient id="gs-logo-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.15" />
    </linearGradient>

    <!-- Star Accent Gradient -->
    <linearGradient id="gs-star-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF69B4" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
  </defs>

  <!-- Background Squircle Container (Edge to Edge for Maximum Visibility) -->
  <rect x="0" y="0" width="512" height="512" rx="120" fill="url(#gs-logo-bg)" />
  <rect x="6" y="6" width="500" height="500" rx="114" fill="none" stroke="url(#gs-logo-border)" stroke-width="8" />

  <!-- Code Bracket Left '<' -->
  <path d="M 68 256 L 118 206 M 68 256 L 118 306" 
        stroke="#FFFFFF" 
        stroke-opacity="0.8" 
        stroke-width="28" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" />

  <!-- Code Bracket Right '>' -->
  <path d="M 444 256 L 394 206 M 444 256 L 394 306" 
        stroke="#FFFFFF" 
        stroke-opacity="0.8" 
        stroke-width="28" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" />

  <!-- Monogram 'G' Vector -->
  <path d="M 238 186 C 224 158 202 144 176 144 C 132 144 112 184 112 256 C 112 328 132 368 176 368 C 220 368 238 330 238 282 V 246 H 168 V 282 H 202 C 200 310 192 328 176 328 C 148 328 144 294 144 256 C 144 218 148 184 176 184 C 194 184 206 194 216 210 Z" 
        fill="#FFFFFF" />

  <!-- Monogram 'S' Vector -->
  <path d="M 364 186 C 350 158 328 144 298 144 C 254 144 234 176 234 216 C 234 256 262 272 298 282 C 334 292 356 306 356 334 C 356 360 332 368 298 368 C 260 368 238 346 234 312 L 268 304 C 271 326 282 334 298 334 C 314 334 322 324 322 312 C 322 296 304 286 278 276 C 242 262 200 244 200 216 C 200 184 242 176 298 176 C 326 176 348 186 356 200 Z" 
        fill="#FFFFFF" />

  <!-- 4-Pointed Sparkle Star Top Right -->
  <path d="M 405 85 Q 405 110 430 110 Q 405 110 405 135 Q 405 110 380 110 Q 405 110 405 85 Z" 
        fill="url(#gs-star-grad)" />
  <circle cx="405" cy="110" r="5" fill="#FFFFFF" opacity="0.95" />
</svg>
