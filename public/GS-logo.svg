<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="gs-logo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Border highlight -->
    <linearGradient id="gs-logo-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1" />
    </linearGradient>

    <!-- Pink Star Gradient -->
    <linearGradient id="gs-star-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF69B4" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="gs-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#gs-logo-bg)" />
  <rect x="6.5" y="6.5" width="107" height="107" rx="27.5" fill="none" stroke="url(#gs-logo-border)" stroke-width="1.5" />

  <!-- Left Bracket '<' -->
  <path d="M 23 60 L 31 52 M 23 60 L 31 68" 
        stroke="#FFFFFF" 
        stroke-opacity="0.45" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" />

  <!-- Right Bracket '>' -->
  <path d="M 97 60 L 89 52 M 97 60 L 89 68" 
        stroke="#FFFFFF" 
        stroke-opacity="0.45" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" />

  <!-- Main Text GS -->
  <g filter="url(#gs-shadow)">
    <text x="60" y="73" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-weight="900" 
          font-size="44" 
          fill="#FFFFFF" 
          text-anchor="middle" 
          letter-spacing="-1">GS</text>
  </g>

  <!-- 4-pointed Sparkle Star on top right of S -->
  <path d="M 83 38 Q 83 43 88 43 Q 83 43 83 48 Q 83 43 78 43 Q 83 43 83 38 Z" 
        fill="url(#gs-star-grad)" 
        filter="url(#gs-shadow)" />
  <circle cx="83" cy="43" r="1.2" fill="#FFFFFF" opacity="0.8" />
</svg>
