<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Purple Brand Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>
    
    <!-- Accent Coral Flare Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    
    <!-- Drop Shadow -->
    <filter id="glowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#7C3AED" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Main Background Badge -->
  <rect x="8" y="8" width="104" height="104" rx="28" fill="url(#bgGrad)" filter="url(#glowShadow)" />
  
  <!-- Subtle Inset Border -->
  <rect x="10" y="10" width="100" height="100" rx="26" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2" />

  <!-- Code Brackets Background Accents -->
  <path d="M 23 60 L 30 53 M 23 60 L 30 67" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M 97 60 L 90 53 M 97 60 L 90 67" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Monogram "GS" -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Letter 'G' -->
    <path d="M 52 46 C 47 40, 36 41, 35 51 C 34 62, 42 70, 52 70 C 58 70, 60 65, 60 59 L 48 59" stroke-width="7" />
    
    <!-- Letter 'S' -->
    <path d="M 83 46 C 77 40, 67 41, 67 48 C 67 55, 83 55, 83 63 C 83 71, 72 71, 66 65" stroke-width="7" />
  </g>

  <!-- Coral Flare Dot -->
  <circle cx="86" cy="38" r="4.5" fill="url(#accentGrad)" stroke="#FFFFFF" stroke-width="1.5" />
</svg>
